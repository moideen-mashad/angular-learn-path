<section class="flex min-h-[calc(100vh-4rem)] items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
  <div class="w-full max-w-md space-y-8 rounded-xl bg-white p-8 shadow-sm border border-neutral-100 dark:bg-neutral-900 dark:border-neutral-800">
    <div>
      <h2 class="mt-6 text-center text-3xl font-bold tracking-tight text-neutral-900 dark:text-white">
        Sign in to your account
      </h2>
      <p class="mt-2 text-center text-sm text-neutral-600 dark:text-neutral-400">
        Welcome back to DecoLux Studio
      </p>
    </div>
    
    <form class="mt-8 space-y-6" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="space-y-4 rounded-md shadow-sm">
        <div>
          <label for="username" class="block text-sm font-medium text-neutral-700 dark:text-neutral-300">Username</label>
          <input 
            id="username" 
            type="text" 
            formControlName="username"
            autocomplete="username" 
            class="relative block w-full rounded-md border-0 py-2.5 text-neutral-900 ring-1 ring-inset ring-neutral-300 focus:z-10 focus:ring-2 focus:ring-inset focus:ring-neutral-900 sm:text-sm sm:leading-6 dark:bg-neutral-950 dark:text-white dark:ring-neutral-700 dark:focus:ring-neutral-100 px-3 mt-1.5 transition-all" 
            placeholder="Enter your username">
        </div>
        
        <div>
          <label for="password" class="block text-sm font-medium text-neutral-700 dark:text-neutral-300">Password</label>
          <input 
            id="password" 
            type="password" 
            formControlName="password"
            autocomplete="current-password" 
            class="relative block w-full rounded-md border-0 py-2.5 text-neutral-900 ring-1 ring-inset ring-neutral-300 focus:z-10 focus:ring-2 focus:ring-inset focus:ring-neutral-900 sm:text-sm sm:leading-6 dark:bg-neutral-950 dark:text-white dark:ring-neutral-700 dark:focus:ring-neutral-100 px-3 mt-1.5 transition-all" 
            placeholder="Enter your password">
        </div>
      </div>

      <div>
        <button 
          type="submit" 
          [disabled]="loginForm.invalid"
          class="group relative flex w-full justify-center rounded-md bg-neutral-900 px-3 py-3 text-sm font-semibold text-white hover:bg-neutral-800 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-neutral-900 dark:bg-white dark:text-neutral-950 dark:hover:bg-neutral-200 disabled:opacity-50 disabled:cursor-not-allowed transition-all">
          Sign in
        </button>
      </div>
    </form>
  </div>
</section>
