<div class="products-container">
  <header class="products-header">
    <h1>Our Products</h1>
    <p>Discover our wide range of high-quality items.</p>
  </header>

  <!-- Loading State -->
  <div class="loading-state" *ngIf="isLoading">
    <div class="spinner"></div>
    <p>Loading products for you...</p>
  </div>

  <!-- Error State -->
  <div class="error-state" *ngIf="errorMessage">
    <div class="error-icon">⚠️</div>
    <p>{{ errorMessage }}</p>
    <button (click)="fetchProducts()" class="retry-button">Try Again</button>
  </div>

  <!-- Products Grid -->
  <div class="products-grid" *ngIf="!isLoading && !errorMessage">
    <article class="product-card" *ngFor="let product of products">
      <div class="product-image-wrapper">
        <img [src]="product.image" [alt]="product.title" class="product-image" loading="lazy" />
        <span class="product-category">{{ product.category }}</span>
      </div>
      
      <div class="product-content">
        <h2 class="product-title" [title]="product.title">{{ product.title }}</h2>
        <p class="product-description">{{ product.description }}</p>
        
        <div class="product-footer">
          <span class="product-price">${{ product.price.toFixed(2) }}</span>
          <div class="product-rating" [title]="product.rating.rate + ' out of 5 stars'">
            <span class="star-icon">⭐</span>
            <span class="rating-rate">{{ product.rating.rate }}</span>
            <span class="rating-count">({{ product.rating.count }})</span>
          </div>
        </div>
        
        <button class="add-to-cart-btn">Add to Cart</button>
      </div>
    </article>
  </div>
</div>
