<nav class="sticky top-0 z-50 w-full border-b border-neutral-200/60 bg-[#FAF9F6]/90 backdrop-blur-md dark:border-neutral-800/60 dark:bg-neutral-950/90 transition-all duration-300">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="flex h-16 items-center justify-between">
      <!-- Logo -->
      <div class="flex flex-shrink-0 items-center">
        <a routerLink="/" class="group flex items-center space-x-2.5">
          <div class="flex h-8 w-8 items-center justify-center rounded bg-neutral-900 dark:bg-neutral-100 shadow-sm transition-colors duration-300">
            <span class="text-sm font-bold text-white dark:text-neutral-950">{{ logoLetter }}</span>
          </div>
          <span class="text-lg font-bold tracking-tight text-neutral-900 dark:text-white">
            {{ brandPrefix }}<span class="font-light text-neutral-500 dark:text-neutral-450">{{ brandSuffix }}</span>
          </span>
        </a>
      </div>

      <!-- Desktop Navigation Menu -->
      <div class="hidden md:block">
        <div class="flex items-center space-x-8">
          @for (item of navItems; track item.label) {
            <a [routerLink]="item.routerLink" 
               routerLinkActive="text-neutral-900 dark:text-white font-semibold" 
               [routerLinkActiveOptions]="{exact: item.routerLink === '/'}"
               class="text-sm font-medium text-neutral-500 hover:text-neutral-900 dark:text-neutral-450 dark:hover:text-white transition-colors duration-200">
              {{ item.label }}
            </a>
          }
        </div>
      </div>

      <!-- CTA Button -->
      <div class="hidden md:flex items-center space-x-4">
        <a href="#" class="rounded px-4 py-2 text-xs font-bold uppercase tracking-wider text-neutral-500 hover:text-neutral-900 dark:text-neutral-450 dark:hover:text-white transition-colors duration-200">{{ signInText }}</a>
        <a routerLink="/contact" class="rounded border border-neutral-900 px-5 py-2 text-xs font-bold uppercase tracking-wider text-neutral-900 hover:bg-neutral-900 hover:text-white dark:border-neutral-100 dark:text-neutral-100 dark:hover:bg-neutral-100 dark:hover:text-neutral-950 transition-all duration-300">
          {{ getStartedText }}
        </a>
      </div>

      <!-- Mobile menu button -->
      <div class="flex md:hidden">
        <button (click)="toggleMobileMenu()" type="button" class="inline-flex items-center justify-center rounded p-2 text-neutral-550 hover:bg-neutral-100 hover:text-neutral-900 focus:outline-none dark:text-neutral-450 dark:hover:bg-neutral-900 dark:hover:text-white transition-all">
          <span class="sr-only">Open main menu</span>
          @if (!isMobileMenuOpen()) {
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
            </svg>
          } @else {
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          }
        </button>
      </div>
    </div>
  </div>

  <!-- Mobile menu -->
  @if (isMobileMenuOpen()) {
    <div class="md:hidden border-t border-neutral-200/60 bg-[#FAF9F6] px-4 py-4 dark:border-neutral-850 dark:bg-neutral-950 space-y-2">
      @for (item of navItems; track item.label) {
        <a [routerLink]="item.routerLink" 
           routerLinkActive="text-neutral-900 bg-neutral-100/50 dark:text-white dark:bg-neutral-900" 
           [routerLinkActiveOptions]="{exact: item.routerLink === '/'}"
           (click)="closeMobileMenu()"
           class="block rounded px-3 py-2 text-sm font-semibold text-neutral-500 hover:bg-neutral-100/50 hover:text-neutral-900 dark:text-neutral-450 dark:hover:bg-neutral-900 dark:hover:text-white transition-all">
          {{ item.label }}
        </a>
      }
      <div class="border-t border-neutral-100 pt-3 dark:border-neutral-900 flex flex-col space-y-2">
        <a href="#" class="text-center rounded px-3 py-2 text-xs font-bold uppercase tracking-wider text-neutral-550 hover:bg-neutral-100/50 hover:text-neutral-900 transition-all">{{ signInText }}</a>
        <a routerLink="/contact" (click)="closeMobileMenu()" class="text-center rounded border border-neutral-900 px-3 py-2.5 text-xs font-bold uppercase tracking-wider text-neutral-900 hover:bg-neutral-900 hover:text-white dark:border-neutral-100 dark:text-neutral-100 dark:hover:bg-neutral-100 dark:hover:text-neutral-950 transition-all">{{ getStartedText }}</a>
      </div>
    </div>
  }
</nav>
