<nav class="sticky top-0 z-50 w-full border-b border-slate-200/50 bg-white/80 backdrop-blur-md dark:border-slate-800/50 dark:bg-slate-950/80 transition-all duration-300">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="flex h-16 items-center justify-between">
      <!-- Logo -->
      <div class="flex flex-shrink-0 items-center">
        <a routerLink="/" class="group flex items-center space-x-2">
          <div class="flex h-9 w-9 items-center justify-center rounded-lg bg-gradient-to-br from-indigo-500 to-purple-600 shadow-md transition-transform group-hover:scale-105">
            <span class="text-lg font-bold text-white">{{ logoLetter }}</span>
          </div>
          <span class="text-xl font-extrabold tracking-tight bg-gradient-to-r from-slate-900 to-slate-700 bg-clip-text text-transparent dark:from-white dark:to-slate-300">
            {{ brandPrefix }}<span class="bg-gradient-to-r from-indigo-500 to-purple-600 bg-clip-text">{{ brandSuffix }}</span>
          </span>
        </a>
      </div>

      <!-- Desktop Navigation Menu -->
      <div class="hidden md:block">
        <div class="flex items-center space-x-8">
          @for (item of navItems; track item.label) {
            <a [routerLink]="item.routerLink" 
               routerLinkActive="text-indigo-600 dark:text-indigo-400 font-bold" 
               [routerLinkActiveOptions]="{exact: item.routerLink === '/'}"
               class="text-sm font-semibold text-slate-600 hover:text-indigo-600 dark:text-slate-300 dark:hover:text-indigo-400 transition-colors">
              {{ item.label }}
            </a>
          }
        </div>
      </div>

      <!-- CTA Button -->
      <div class="hidden md:flex items-center space-x-4">
        <a href="#" class="rounded-lg px-4 py-2 text-sm font-semibold text-slate-700 hover:text-slate-950 dark:text-slate-300 dark:hover:text-white transition-colors">{{ signInText }}</a>
        <a routerLink="/contact" class="relative group overflow-hidden rounded-lg bg-gradient-to-r from-indigo-600 to-purple-600 px-5 py-2.5 text-sm font-semibold text-white shadow-md hover:shadow-indigo-500/25 transition-all duration-300 hover:-translate-y-0.5">
          <span class="relative z-10">{{ getStartedText }}</span>
          <div class="absolute inset-0 -translate-x-full bg-gradient-to-r from-purple-600 to-indigo-600 transition-transform duration-300 group-hover:translate-x-0"></div>
        </a>
      </div>

      <!-- Mobile menu button -->
      <div class="flex md:hidden">
        <button (click)="toggleMobileMenu()" type="button" class="inline-flex items-center justify-center rounded-lg p-2.5 text-slate-500 hover:bg-slate-100 hover:text-slate-700 focus:outline-none dark:text-slate-400 dark:hover:bg-slate-900 dark:hover:text-white transition-all">
          <span class="sr-only">Open main menu</span>
          @if (!isMobileMenuOpen()) {
            <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
            </svg>
          } @else {
            <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          }
        </button>
      </div>
    </div>
  </div>

  <!-- Mobile menu -->
  @if (isMobileMenuOpen()) {
    <div class="md:hidden border-t border-slate-200/50 bg-white/95 px-4 py-4 dark:border-slate-800/50 dark:bg-slate-950/95 space-y-3 animate-fade-in-down">
      @for (item of navItems; track item.label) {
        <a [routerLink]="item.routerLink" 
           routerLinkActive="text-indigo-600 bg-slate-50 dark:text-indigo-400 dark:bg-slate-900" 
           [routerLinkActiveOptions]="{exact: item.routerLink === '/'}"
           (click)="isMobileMenuOpen.set(false)"
           class="block rounded-lg px-3 py-2 text-base font-semibold text-slate-600 hover:bg-slate-50 hover:text-indigo-600 dark:text-slate-300 dark:hover:bg-slate-900 dark:hover:text-indigo-400 transition-all">
          {{ item.label }}
        </a>
      }
      <div class="border-t border-slate-100 pt-3 dark:border-slate-800 flex flex-col space-y-2">
        <a href="#" class="text-center rounded-lg px-3 py-2 text-base font-semibold text-slate-600 hover:bg-slate-50 hover:text-indigo-600 dark:text-slate-300 dark:hover:bg-slate-900 transition-all">{{ signInText }}</a>
        <a routerLink="/contact" (click)="isMobileMenuOpen.set(false)" class="text-center rounded-lg bg-gradient-to-r from-indigo-600 to-purple-600 px-3 py-2.5 text-base font-semibold text-white shadow-md transition-all">{{ getStartedText }}</a>
      </div>
    </div>
  }
</nav>
